name: CI

# Like the dblp project: tests on GitHub's runner, the real work on dblp-vm. Every push runs the
# tests; a push to main then builds and runs the report on the VM (vm.yml, job=report) and uploads
# the executed notebook, figures and tables as the run's artifact. The VM step skips cleanly until
# the VM_HOST secret exists.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_host: ${{ steps.vm.outputs.has_host }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t cardio-risk .
      - name: Tests
        run: docker run --rm cardio-risk python -m pytest -q -p no:cacheprovider
      - name: Is the VM configured?
        id: vm
        env:
          HAS_HOST: ${{ secrets.VM_HOST != '' }}
        run: |
          echo "has_host=$HAS_HOST" >> "$GITHUB_OUTPUT"
          [ "$HAS_HOST" = true ] || echo "VM_HOST secret is not set - the report will not run on the VM."

  report-on-vm:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.test.outputs.has_host == 'true'
    uses: ./.github/workflows/vm.yml
    with:
      action: run
      job: report
    secrets: inherit
