name: CI

# Every push: build the image and run the tests on GitHub's runner (about a minute). The report itself
# runs on dblp-vm only on demand (Actions -> VM -> run, job=report): it takes ~10 minutes of runner
# time while the job is followed, and Actions minutes on private repos are limited.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t cardio-risk .
      - name: Tests
        run: docker run --rm cardio-risk python -m pytest -q -p no:cacheprovider
